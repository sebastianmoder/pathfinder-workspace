[build]
  ignore = "node ./scripts/netlify-ignore.mjs guard"
  command = "pnpm --filter @pathfinder/guard build"
  publish = "apps/guard/.next"

[build.environment]
  NODE_VERSION = "22.22.0"

[functions]
  directory = "apps/guard/netlify/functions"


[[redirects]]
  from = "https://pathfinder-guard.netlify.app/*"
  to = "https://guard.ai-pathfinder.eu/:splat"
  status = 301
  force = true
